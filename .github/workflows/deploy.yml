name: CI/CD Deploy to AWS EC2

# 1. 언제 이 비서를 깨울 것인가?
on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 push되면 실행!

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # GitHub이 제공하는 가상의 깨끗한 리눅스 컴퓨터를 빌림

    steps:
    # Step 1: GitHub 서버에 올라간 우리의 소스 코드를 가상 컴퓨터로 가져옵니다.
    - name: Checkout code
      uses: actions/checkout@v6

    # Step 2: 가상 컴퓨터를 Docker Hub에 로그인시킵니다. (아까 등록한 금고 키 사용)
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Step 3: 우리 코드를 도커 이미지로 빌드하고, Docker Hub에 업로드(Push)합니다.
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/realtime-chat:latest

    # Step 4: 원격으로 AWS EC2 서버에 접속해서 명령어를 실행합니다.
    - name: SSH Remote Commands and Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ubuntu
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          # 1. 기존에 돌고 있던 컨테이너가 있다면 멈추고 삭제합니다. (포트 충돌 방지)
          docker stop my-chat-container || true
          docker rm my-chat-container || true
          
          # 2. Docker Hub에서 방금 빌드되어 올라온 최신 이미지를 다운로드(Pull)합니다.
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/realtime-chat:latest
          
          # 3. 다운로드받은 최신 이미지로 채팅 앱 컨테이너를 새로 실행합니다!
          docker run -d -p 3000:3000 --name my-chat-container ${{ secrets.DOCKERHUB_USERNAME }}/realtime-chat:latest
          
          # 4. 안 쓰는 예전 도커 이미지들을 청소해 줍니다. (AWS 용량 아끼기)
          docker image prune -f