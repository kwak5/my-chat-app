name: CI/CD Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/realtime-chat:latest

    - name: SSH Remote Commands and Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ubuntu
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          # 💡 모든 docker 명령어 앞에 sudo를 추가하여 권한 문제를 해결합니다.
          sudo docker stop my-chat-container || true
          sudo docker rm my-chat-container || true
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/realtime-chat:latest
          sudo docker run -d -p 3000:3000 --name my-chat-container ${{ secrets.DOCKERHUB_USERNAME }}/realtime-chat:latest
          sudo docker image prune -f